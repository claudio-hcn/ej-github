<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-secondary text-light">
  <h1 class="text-center">PRUEBAS CON GITHUB</h1>
  <div class="text-center">
    <button type="button" class="btn btn-warning mt-5" data-bs-toggle="popover" data-bs-placement="right"
      data-bs-custom-class="custom-popover" data-bs-title="Popover de bonito no más"
      data-bs-content="Esto es solo para rellenar la página">
      hola
    </button>

 
  </div>
<div class="text-center">
 <button type="button" class="btn btn-success mt-5" id="btn-saludo">Saludo</button> 
</div>
 <div class="bg-light container text-center col-10 col-lg-6 mt-5" id="saludoForm">
    <div class="form-group">
        <input type="text" id="inputNombre" class="form-control" placeholder="Ingresa tu nombre">
    </div>
    <div class="d-flex justify-content-between mt-3">
        <button id="btnSaludar" class="btn btn-success btn-sm">Lanzar saludoo</button>
        <button id="btnCancelar" class="btn btn-secondary border-light btn-sm">Cancelar</button>
    </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <!-- Inicializar popovers -->
  <script>
    const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
    const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl));
  </script>
</body>

</html>
